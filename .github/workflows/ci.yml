name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Build (ESM/CJS/UMD + d.ts)
        run: yarn build

      - name: Vendored big.js test suite 
        run: yarn test

      - name: Package exports check (attw + publint)
        run: yarn check:exports
