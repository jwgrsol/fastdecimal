# OpenSSF Scorecard — automated supply-chain security posture scoring.
# Results appear in the repository's Security tab and on the public scorecard
# viewer (https://scorecard.dev/viewer/?uri=github.com/jwgrsol/fastdecimal).
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    if: github.repository == 'jwgrsol/fastdecimal'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
