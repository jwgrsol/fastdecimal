# Guards the tree-shaking story: every import-shape scenario must stay within
# the gzipped budget in bench/bundle-size.budget.json. On an intentional size
# change, update the budget file in the same commit.
name: Bundle Size

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bench/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/bundle-size.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/bundle-size.yml'

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Check bundle sizes against budget
        run: node bench/bundle-size.mjs --check
