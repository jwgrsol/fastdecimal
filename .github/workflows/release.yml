# Publishes to npm with provenance when a version tag (v*) is pushed.
# The exact tarball that passes verification (attw) is what gets published and
# attached to the GitHub Release — no re-packing between check and publish.
#
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret required, but the
# package must be configured once on npmjs.com:
#   Package settings → Publishing access → Add trusted publisher
#   → GitHub Actions, repository jwgrsol/fastdecimal, workflow release.yml
# For the very first publish (before the package exists on npm), either publish
# manually once (`npm publish --provenance --access public` from a logged-in,
# 2FA-enabled account) or add an automation token as NPM_TOKEN and uncomment
# the env line below.
name: Release

on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Lint
        run: yarn lint --max-warnings 0

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Full test suite (vendored + unit + differential)
        run: yarn test

      - name: Pack the release tarball
        run: mkdir -p out && yarn pack --out out/%s-%v.tgz

      - name: Check package entrypoints on the exact tarball (attw)
        run: yarn attw out/*.tgz

      - name: publint
        run: yarn publint --pack yarn

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: out/*.tgz
          generate_release_notes: false

      - name: Publish the verified tarball to npm with provenance
        run: npm publish --provenance --access public out/*.tgz
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
